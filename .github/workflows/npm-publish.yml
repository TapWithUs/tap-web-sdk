name: Publish to npm

on:
  push:
    tags:
      - 'v*'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js 24.x
      uses: actions/setup-node@v4
      with:
        node-version: '24.x'

    - name: Use npm 11.5.1 for OIDC
      run: npm install -g npm@11.5.1

    - name: Check tag matches package.json version
      run: |
        TAG="${GITHUB_REF_NAME#v}"
        PKG="$(node -p "require('./package.json').version")"
        if [ "$TAG" != "$PKG" ]; then
          echo "Tag v$TAG does not match package.json version $PKG"
          exit 1
        fi

    - name: Show OIDC environment
      run: |
        echo "npm $(npm --version)"
        echo "node $(node --version)"
        echo "OIDC_URL=${ACTIONS_ID_TOKEN_REQUEST_URL:+set}"
        echo "OIDC_TOKEN=${ACTIONS_ID_TOKEN_REQUEST_TOKEN:+set}"

    - name: Install dependencies
      run: npm ci

    - name: Run tests
      run: npm test

    - name: Build
      run: npm run build

    - name: Publish
      run: npm publish --access public --loglevel verbose
